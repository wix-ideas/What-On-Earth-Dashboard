<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>What On Earth Are You Talking About?</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <div id="starBg"></div>
        <div id="earthTop"></div>

        <div id="modeSelectModal" class="modal">
            <div class="modal-content">
                <div class="game-mode-list">
                    <button class="game-mode-btn" onclick="selectMode('woe')">What On Earth</button>
                    <button class="game-mode-btn" onclick="selectMode('skeleton')">Skeleton Crew [2p–3p]</button>
                    <button class="game-mode-btn" onclick="selectMode('encounters')">Close Encounters</button>
                    <button class="game-mode-btn" onclick="selectMode('space')">Space Race</button>
                </div>
            </div>
        </div>

        <div id="menuModal" class="modal">
            <div class="modal-content">
                <div class="menu-list">
                    <button class="btn btn-tertiary" onclick="showTutorial()">Tutorial</button>
                    <button class="btn btn-tertiary" onclick="confirmNewGame()">New Game</button>
                    <button class="btn btn-tertiary" onclick="confirmExit()">Exit Game</button>
                </div>
            </div>
        </div>

        <div id="setupScreen" class="screen">
            <div class="header">
                <div class="brand-row">
                    <div class="title-wrap">
                        <div class="title-line-1">WHAT ON EARTH</div>
                        <div class="title-line-2">ARE YOU TALKING ABOUT?</div>
                    </div>
                    <button class="menu-btn" onclick="openMenu()">
                        <div class="menu-bars">
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                        </div>
                    </button>
                </div>
            </div>

            <div class="board">
                <div class="players-wrap">
                    <div id="playersList" class="players-list"></div>
                    <div id="addPlayerRow" class="player-row" style="display: none;">
                        <div class="player-icon"></div>
                        <input id="addPlayerInput" class="player-input" maxlength="3" placeholder="___" 
                               onkeydown="handleAddPlayerKeydown(event)" />
                        <div class="row-tools">
                            <button class="tool-btn delete" onclick="cancelAddPlayer()">×</button>
                            <button class="tool-btn" onclick="confirmAddPlayer()">✓</button>
                        </div>
                    </div>
                </div>

                <button id="wideAddBtn" class="btn btn-tertiary" onclick="showAddMode()">+</button>

                <div class="spacer"></div>

                <div class="nsfw-row">
                    <div id="nsfwPill" class="nsfw-pill">
                        <div class="nsfw-label">NSFW</div>
                    </div>
                    <button id="nsfwSwitch" class="nsfw-switch" onclick="toggleNSFW()">
                        <div class="nsfw-knob"></div>
                    </button>
                </div>
            </div>

            <button id="startBtn" class="btn btn-primary" onclick="startGame()">START GAME</button>
        </div>

        <div id="gameScreen" class="screen">
            <div class="game-header">
                <div class="timer-display" id="timerDisplay">2:00</div>
                <div class="game-controls">
                    <button class="control-btn" onclick="togglePause()">⏸</button>
                    <button class="control-btn" onclick="previousConcept()">◀</button>
                    <button class="control-btn" onclick="skipConcept()">▶</button>
                </div>
                <div id="gameTitleText" class="game-title">WHAT ON EARTH<br>ARE YOU TALKING ABOUT?</div>
                <button id="exitGameBtn" class="close-btn" onclick="exitGame()">✕</button>
            </div>

            <div class="board">
                <div id="conceptDisplay" class="concept-display" onclick="revealConcept()">
                    EARTH CONCEPT
                </div>

                <div id="alienPlayers" class="alien-players"></div>
                
                <div class="astronaut-score" id="astronautScore">1</div>
            </div>

            <button id="nextRoundBtn" class="btn btn-primary" style="display: none;" onclick="goToInterRound()">NEXT ROUND</button>
        </div>

        <div id="interRoundScreen" class="screen">
            <div class="header">
                <div class="brand-row">
                    <div class="title-wrap">
                        <div class="title-line-1">WHAT ON EARTH</div>
                        <div class="title-line-2">ARE YOU TALKING ABOUT?</div>
                    </div>
                    <button class="menu-btn" onclick="openMenu()">
                        <div class="menu-bars">
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                        </div>
                    </button>
                </div>
            </div>

            <div class="board">
                <button class="btn btn-tertiary" onclick="toggleEditMode()">EDIT</button>

                <div class="players-wrap">
                    <div id="interPlayersList" class="players-list"></div>
                </div>

                <div class="spacer"></div>
            </div>

            <button class="btn btn-primary" onclick="nextRound()">NEXT ROUND</button>
        </div>

        <div id="endGameScreen" class="screen">
            <div class="header">
                <div class="brand-row">
                    <div class="title-wrap">
                        <div class="title-line-1">WHAT ON EARTH</div>
                        <div class="title-line-2">ARE YOU TALKING ABOUT?</div>
                    </div>
                    <button class="menu-btn" onclick="openMenu()">
                        <div class="menu-bars">
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                        </div>
                    </button>
                </div>
            </div>

            <div class="board">
                <div class="winner-display">
                    <div class="winner-text">
                        <span id="winnerName">WINNER</span> WINS!
                    </div>
                    <div class="winner-score">
                        Score: <span id="winnerScore">0</span>
                    </div>
                </div>

                <div class="players-wrap">
                    <div id="finalScoresList" class="players-list"></div>
                </div>

                <div class="spacer"></div>
            </div>

            <button class="btn btn-secondary" onclick="continuePlaying()">CONTINUE PLAYING</button>
            <button class="btn btn-primary" onclick="confirmNewGame()">NEW GAME</button>
            <button class="btn btn-tertiary" onclick="goToLanding()">MAIN MENU</button>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
