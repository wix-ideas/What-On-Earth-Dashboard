<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="What On Earth">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1C313B">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://static.wixstatic.com/media/1369e3_d8dd2f5c0d2d499fa414f3423d6b1bbd~mv2.png">
    <title>What On Earth Are You Talking About?</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <div id="starBg"></div>
        <div id="earthTop"></div>

        <div id="menuPopover" class="menu-popover">
            <div class="menu-list">
                <button class="menu-item-btn" onclick="showTutorial()">TUTORIAL</button>
                <button class="menu-item-btn" onclick="confirmNewGame()">NEW GAME</button>
                <button class="menu-item-btn" onclick="confirmExit()">EXIT GAME</button>
            </div>
        </div>

        <div id="setupScreen" class="screen" style="display: flex;">
            <div class="header">
                <div class="brand-row">
                    <div class="title-wrap">
                        <div class="title-line-1">WHAT ON EARTH</div>
                        <div class="title-line-2">ARE YOU TALKING ABOUT?</div>
                    </div>
                    <button class="menu-btn" onclick="toggleMenu()" id="menuBtn">
                        <div class="menu-bars" id="menuBars">
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                        </div>
                        <div class="menu-x" id="menuX" style="display: none;">×</div>
                    </button>
                </div>
            </div>

            <div class="board">
                <div class="mode-dropdown-wrap">
                    <select id="modeDropdown" class="mode-dropdown" onchange="handleModeChange(event)">
                        <option value="woe">What On Earth</option>
                        <option value="skeleton">Skeleton Crew [2p–3p]</option>
                        <option value="encounters">Close Encounters</option>
                        <option value="space">Space Race</option>
                    </select>
                </div>

                <!-- First divider below dropdown -->
                <div class="divider"></div>

                <!-- Add button - shows here when no players -->
                <button id="wideAddBtn" class="btn-add">+</button>

                <div class="players-wrap">
                    <div id="playersList" class="players-list">
                        <!-- Add button will be moved here when players exist -->
                    </div>
                </div>

                <!-- Add player input row -->
                <div id="addPlayerRow" class="player-row" style="display: none;">
                    <div class="player-icon"></div>
                    <input id="addPlayerInput" class="player-input" maxlength="3" placeholder="___" 
                           onkeydown="handleAddPlayerKeydown(event)" />
                    <div class="row-tools">
                        <button class="tool-btn delete">
                            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                        <button class="tool-btn" onclick="movePlayerUp('temp')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m18 15-6-6-6 6"/></svg>
                        </button>
                        <button class="tool-btn" onclick="movePlayerDown('temp')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m6 9 6 6 6-6"/></svg>
                        </button>
                        <button class="tool-btn">
                            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Tutorial text -->
                <div class="tutorial-text" onclick="openMenu()">OPEN MENU FOR TUTORIAL</div>
                
                <!-- Second divider above NSFW -->
                <div class="divider"></div>
                
                <!-- NSFW Toggle at bottom -->
                <div class="nsfw-row">
                    <div class="nsfw-label">NSFW</div>
                    <button id="nsfwSwitch" class="nsfw-switch"></button>
                </div>
            </div>

            <div class="bottom-controls">
                <button id="startBtn" class="btn btn-primary">START GAME</button>
            </div>
        </div>

        <div id="gameScreen" class="screen">
            <div class="game-header">
                <button id="startTimerBtn" class="start-timer-btn" onclick="startTimerFromButton()" style="display: none;">START</button>
                <div class="timer-display" id="timerDisplay">2:00</div>
                <div class="game-controls">
                    <button class="control-btn" id="pauseBtn" onclick="togglePause()" title="Play/Pause">▶</button>
                    <button class="control-btn" onclick="previousConcept()" title="Previous">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m15 18-6-6 6-6"/></svg>
                    </button>
                    <button class="control-btn" onclick="skipConcept()" title="Skip">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                </div>
                <div id="gameTitleText" class="game-title">
                    <div class="title-line-1">WHAT ON EARTH</div>
                    <div class="title-line-2">ARE YOU TALKING ABOUT?</div>
                </div>
                <button id="exitGameBtn" class="close-btn" onclick="exitGame()">×</button>
            </div>

            <div class="board">
                <div id="conceptDisplay" class="concept-display" onclick="revealConcept()">
                    TAP TO REVEAL
                </div>

                <div id="alienPlayers" class="alien-players"></div>
                
                <div class="astronaut-score" id="astronautScore">0</div>
            </div>

            <button id="nextRoundBtn" class="btn btn-primary" style="display: none;" onclick="goToInterRound()">NEXT ROUND</button>
        </div>

        <div id="interRoundScreen" class="screen">
            <div class="header">
                <div class="brand-row">
                    <div class="title-wrap">
                        <div class="title-line-1">WHAT ON EARTH</div>
                        <div class="title-line-2">ARE YOU TALKING ABOUT?</div>
                    </div>
                    <button class="menu-btn" onclick="toggleMenu()" id="menuBtnInterRound">
                        <div class="menu-bars" id="menuBarsInterRound">
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                        </div>
                        <div class="menu-x" id="menuXInterRound" style="display: none;">×</div>
                    </button>
                </div>
            </div>

            <div class="board">
                <button class="btn btn-tertiary" onclick="toggleEditMode()">EDIT</button>

                <div class="players-wrap">
                    <div id="interPlayersList" class="players-list"></div>
                </div>

                <div class="spacer"></div>
            </div>

            <button class="btn btn-primary" onclick="nextRound()">NEXT ROUND</button>
        </div>

        <div id="endGameScreen" class="screen">
            <div class="header">
                <div class="brand-row">
                    <div class="title-wrap">
                        <div class="title-line-1">WHAT ON EARTH</div>
                        <div class="title-line-2">ARE YOU TALKING ABOUT?</div>
                    </div>
                    <button class="menu-btn" onclick="toggleMenu()" id="menuBtnEndGame">
                        <div class="menu-bars" id="menuBarsEndGame">
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                        </div>
                        <div class="menu-x" id="menuXEndGame" style="display: none;">×</div>
                    </button>
                </div>
            </div>

            <div class="board">
                <div class="winner-display">
                    <div class="winner-text">
                        <span id="winnerName">WINNER</span> WINS!
                    </div>
                    <div class="winner-score">
                        Score: <span id="winnerScore">0</span>
                    </div>
                </div>

                <div class="players-wrap">
                    <div id="finalScoresList" class="players-list"></div>
                </div>

                <div class="spacer"></div>
            </div>

            <button class="btn btn-secondary" onclick="continuePlaying()">CONTINUE PLAYING</button>
            <button class="btn btn-primary" onclick="confirmNewGame()">NEW GAME</button>
            <button class="btn btn-tertiary" onclick="goToLanding()">MAIN MENU</button>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
    <script>
        // Ensure functions are available immediately for onclick handlers
        window.addEventListener('DOMContentLoaded', function() {
            // Wait for module to load and attach functions
            setTimeout(function() {
                if (!window.showAddMode) {
                    console.error('showAddMode function not available');
                }
                if (!window.toggleNSFW) {
                    console.error('toggleNSFW function not available');
                }
            }, 100);
        });
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('ServiceWorker registration successful');
                    }, function(err) {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
