<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1C313B">
    <title>What On Earth Are You Talking About?</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app" class="container-fluid vh-100 p-3">
        <!-- Space Background -->
        <div id="starBg"></div>
        <div id="earthTop"></div>

        <!-- Main Content -->
        <div class="row h-100">
            <div class="col-12">
                <!-- Header -->
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <div>
                        <h1 class="game-title mb-0">WHAT ON EARTH</h1>
                        <p class="game-subtitle mb-0">ARE YOU TALKING ABOUT?</p>
                    </div>
                    <button class="btn menu-btn" data-bs-toggle="modal" data-bs-target="#menuModal">
                        <div class="menu-bars">
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                        </div>
                    </button>
                </div>

                <!-- Game Board -->
                <div class="game-board flex-grow-1 d-flex flex-column">
                    <!-- Game Mode Dropdown -->
                    <div class="mb-3">
                        <select class="form-select mode-dropdown" id="modeDropdown">
                            <option value="woe">What On Earth</option>
                            <option value="skeleton">Skeleton Crew [2p–3p]</option>
                            <option value="encounters">Close Encounters</option>
                            <option value="space">Space Race</option>
                        </select>
                    </div>

                    <!-- Players List -->
                    <div class="players-container flex-grow-1 mb-3">
                        <div id="playersList" class="players-list"></div>
                        
                        <!-- Add Player Row (Hidden by default) -->
                        <div id="addPlayerRow" class="player-row d-none">
                            <div class="player-icon"></div>
                            <input id="addPlayerInput" class="form-control player-input" maxlength="3" placeholder="___">
                            <div class="player-tools">
                                <button class="btn tool-btn" onclick="cancelAddPlayer()">×</button>
                                <button class="btn tool-btn" onclick="confirmAddPlayer()">✓</button>
                            </div>
                        </div>
                    </div>

                    <!-- Add Player Button -->
                    <button id="addBtn" class="btn add-btn w-100 mb-3" onclick="showAddMode()">+</button>

                    <!-- NSFW Toggle -->
                    <div class="nsfw-container mb-3">
                        <div class="nsfw-label" onclick="toggleNSFW()">NSFW</div>
                        <button id="nsfwSwitch" class="nsfw-switch" onclick="toggleNSFW()">
                            <div class="nsfw-indicator"></div>
                        </button>
                    </div>

                    <!-- Start Game Button -->
                    <button id="startBtn" class="btn start-btn w-100" onclick="startGame()">START GAME</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Menu Modal -->
    <div class="modal fade" id="menuModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content game-modal">
                <div class="modal-body">
                    <button class="btn menu-item w-100 mb-3" onclick="showTutorial()">TUTORIAL</button>
                    <button class="btn menu-item w-100 mb-3" onclick="confirmNewGame()">NEW GAME</button>
                    <button class="btn menu-item w-100" onclick="confirmExit()">EXIT GAME</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
